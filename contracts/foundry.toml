[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.24"
optimizer = true
optimizer_runs = 200
remappings = [
    "openzeppelin-contracts/=lib/openzeppelin-contracts/",
    "forge-std/=lib/forge-std/src/",
]

# Arc Testnet — see https://docs.arc.io/arc/references/connect-to-arc
[rpc_endpoints]
arc_testnet = "https://rpc.testnet.arc.network"

[etherscan]
# ArcScan (testnet.arcscan.app) verification — fill in ARCSCAN_API_KEY in .env
# once Arc's explorer verification API/key format is confirmed.
# arc_testnet = { key = "${ARCSCAN_API_KEY}", url = "https://testnet.arcscan.app/api" }
